name: Import SellCore project

on:
  push:
    branches: [main]
    paths:
      - "SellCore-Cloudflare.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and extract SellCore
        shell: bash
        run: |
          set -euo pipefail
          cat .sellcore-import/mini-* > .sellcore-import/archive.b64
          base64 -d .sellcore-import/archive.b64 > .sellcore-import/SellCore-Cloudflare.tar.xz
          mkdir .sellcore-import/extracted
          tar -xJf .sellcore-import/SellCore-Cloudflare.tar.xz -C .sellcore-import/extracted
          cp -a .sellcore-import/extracted/. ./
          rm -rf .sellcore-import
          rm -f .gitkeep
          rm -f .github/workflows/import-sellcore.yml

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SellCore Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import SellCore Cloudflare project"
          git push
